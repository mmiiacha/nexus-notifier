name: Nexus Mods API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check PalEdit on Nexus Mods
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: |
          curl -i \
            -H "apikey: ${NEXUS_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.nexusmods.com/v1/games/palworld/mods/104.json"
